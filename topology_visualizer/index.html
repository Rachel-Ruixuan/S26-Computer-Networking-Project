<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internet Topology Explorer</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-block">
      <h1>Internet Topology Explorer</h1>
      <p>Interactive geographic visualization of traceroute paths and hop IPs.</p>
    </div>

    <div class="legend">
      <span class="legend-item">
        <span class="legend-dot source-dot"></span>
        Source
      </span>
      <span class="legend-item">
        <span class="legend-dot node-dot"></span>
        Hop
      </span>
      <span class="legend-item">
        <span class="legend-dot destination-dot"></span>
        Destination
      </span>
    </div>
  </header>

  <main class="page">
    <section class="map-shell">
      <div id="map"></div>
    </section>

    <section class="analysis-shell">
      <h2>Further analysis</h2>
      <div class="analysis-placeholder">
        Reserved for future statistics, tables, protocol comparison, or summary insights.
      </div>
    </section>
  </main>

  <script src="data.js"></script>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script src="app.js"></script>
</body>
</html>
